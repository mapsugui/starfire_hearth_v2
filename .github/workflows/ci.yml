name: CI

# Pushes to main and pull requests; a pull request's branch is not built twice (DESIGN_LOG 39).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run; runs on main always finish (they deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Data, tests, bot smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot

      - name: Import project (asset imports and class names)
        run: godot --headless --path . --import

      - name: Validate data
        run: godot --headless --path . -s tools/validate_data.gd

      - name: Tests (unit, integration, golden, saves, data, boundary, headless UI audit)
        run: godot --headless --path . -s tests/run_tests.gd

      - name: Bot smoke test (3 seeds x 60 turns, each replayed for determinism)
        run: |
          for policy in balanced random-legal; do
            godot --headless --path . -s tools/bot_run.gd -- --scenario s1 --policy "$policy" --seeds 1-3 --turns 60 --out telemetry --check-determinism
          done

      - name: Telemetry gates (invariants, determinism, performance; balance is advisory here)
        run: godot --headless --path . -s tools/telemetry_report.gd -- --in telemetry --balance advisory

      - name: Palette report
        run: godot --headless --path . -s tools/palette_report.gd

      - name: Audio preview (every synthesised fallback sound, for a listening check)
        run: godot --headless --path . -s tools/audio_preview.gd -- --out build/audio_preview

      - uses: actions/upload-artifact@v4
        with:
          name: audio-preview
          path: build/audio_preview/
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telemetry
          path: telemetry/
          retention-days: 14
          if-no-files-found: ignore

  balance:
    name: Balance telemetry (20 seeds x 4 policies, Scenario 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot

      - name: Import project
        run: godot --headless --path . --import

      - name: Bot runs (Normal for every policy, Story for balanced)
        run: |
          for policy in balanced economy turtle random-legal; do
            godot --headless --path . -s tools/bot_run.gd -- --scenario s1 --policy "$policy" --seeds 1-20 --turns 105 --out balance > "balance_$policy.log" 2>&1 &
          done
          godot --headless --path . -s tools/bot_run.gd -- --scenario s1 --policy balanced --difficulty story --seeds 1-20 --turns 105 --out balance > balance_story.log 2>&1 &
          wait
          tail -n 3 balance_*.log

      - name: Balance gates (advisory until the M1 gate)
        run: godot --headless --path . -s tools/telemetry_report.gd -- --in balance --balance advisory

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-telemetry
          path: balance/
          retention-days: 7
          if-no-files-found: ignore

  screens:
    name: Screenshot tour and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libgl1 libglx-mesa0 libgl1-mesa-dri \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0

      - uses: ./.github/actions/setup-godot

      - name: Import project
        run: godot --headless --path . --import

      - name: Screenshot tour and id audit (PC and phone, 100% and 200% text)
        run: xvfb-run -a -s "-screen 0 2560x1600x24" godot --rendering-driver opengl3 --path . -s tools/screenshot_tour.gd -- --out screens

      - name: Icon contact sheet
        if: always()
        run: xvfb-run -a -s "-screen 0 2560x1600x24" godot --rendering-driver opengl3 --path . -s tools/icon_sheet.gd -- --out screens/icon_sheet.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens/
          retention-days: 7
          if-no-files-found: ignore

  export:
    name: Export Web, Windows and Linux
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Import project
        run: godot --headless --path . --import

      - name: Export
        run: |
          mkdir -p build/web build/windows build/linux
          touch build/.gdignore
          godot --headless --path . --export-release "Web" build/web/index.html
          godot --headless --path . --export-release "Windows" build/windows/StarfireHearth.exe
          godot --headless --path . --export-release "Linux" build/linux/StarfireHearth.x86_64
          test -f build/web/index.wasm
          test -f build/windows/StarfireHearth.exe
          test -f build/linux/StarfireHearth.x86_64

      # Section 9.11 budget: under 150 MB, measured as the compressed download (DESIGN_LOG 37, 49).
      - name: Web build size
        run: |
          raw=$(du -sb build/web | cut -f1)
          gz=0
          for f in build/web/*; do gz=$((gz + $(gzip -9 -c "$f" | wc -c))); done
          echo "Web build: $raw bytes on disk, $gz bytes as a gzip download (budget 150000000)"
          test "$gz" -lt 150000000

      - name: Web build smoke test (headless Chromium as a PC, an Android phone and an iPad)
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw/node_modules
        run: |
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$PLAYWRIGHT_DIR/.bin/playwright" install chromium
          # The browser must reach the same state as the desktop after one turn.
          HASH=$(godot --headless --path . -s tools/smoke_hash.gd | tail -n 1)
          echo "desktop state after one turn: $HASH"
          node tools/web_smoke.mjs --build build/web --out screens/web --expect-hash "$HASH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke
          path: screens/web/
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

      # Desktop builds are large; keep them for main and manual runs only.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          name: windows-build
          path: build/windows/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          name: linux-build
          path: build/linux/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: build/web

  deploy:
    name: Deploy the web build to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [export, screens]
    runs-on: ubuntu-24.04
    # Pages must be enabled (Settings > Pages > Source: GitHub Actions). Until it is, this job
    # fails on its own without turning the checks red.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
