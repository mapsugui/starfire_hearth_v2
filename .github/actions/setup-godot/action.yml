name: Set up Godot
description: >
  Installs the Godot editor pinned in .godot-version (cached), and optionally the Linux, Windows
  and Web export templates (cached; only those files are kept from the templates archive).
inputs:
  templates:
    description: Also install export templates.
    default: "false"
runs:
  using: composite
  steps:
    - id: ver
      shell: bash
      run: |
        v="$(tr -d '[:space:]' < .godot-version)"
        echo "version=$v" >> "$GITHUB_OUTPUT"
        echo "templates_dir=$HOME/.local/share/godot/export_templates/${v/-/.}" >> "$GITHUB_OUTPUT"

    - id: cache-editor
      uses: actions/cache@v4
      with:
        path: ~/.godot-bin
        key: godot-editor-${{ steps.ver.outputs.version }}-linux-x86_64

    - if: steps.cache-editor.outputs.cache-hit != 'true'
      shell: bash
      env:
        V: ${{ steps.ver.outputs.version }}
      run: |
        mkdir -p ~/.godot-bin
        curl -fsSL --retry 4 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/.godot-bin
        rm /tmp/godot.zip

    - shell: bash
      env:
        V: ${{ steps.ver.outputs.version }}
      run: |
        ln -sf "$HOME/.godot-bin/Godot_v${V}_linux.x86_64" "$HOME/.godot-bin/godot"
        chmod +x "$HOME/.godot-bin/godot"
        echo "$HOME/.godot-bin" >> "$GITHUB_PATH"

    - if: inputs.templates == 'true'
      id: cache-templates
      uses: actions/cache@v4
      with:
        path: ${{ steps.ver.outputs.templates_dir }}
        key: godot-templates-${{ steps.ver.outputs.version }}-web-win-linux

    - if: inputs.templates == 'true' && steps.cache-templates.outputs.cache-hit != 'true'
      shell: bash
      env:
        V: ${{ steps.ver.outputs.version }}
        DEST: ${{ steps.ver.outputs.templates_dir }}
      run: |
        mkdir -p "$DEST"
        curl -fsSL --retry 4 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
        unzip -j -q /tmp/templates.tpz \
          templates/version.txt templates/icudt_godot.dat \
          templates/linux_release.x86_64 templates/linux_debug.x86_64 \
          templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
          templates/windows_release_x86_64_console.exe templates/windows_debug_x86_64_console.exe \
          templates/web_nothreads_release.zip templates/web_nothreads_debug.zip \
          -d "$DEST"
        rm /tmp/templates.tpz
