html/custom_html_shell=""
html/head_include="<script>(()=>{const install=()=>{const canvas=document.getElementById('canvas');if(!canvas){window.setTimeout(install,50);return;}const notice=document.createElement('section');notice.id='webgl-recovery-notice';notice.hidden=true;notice.setAttribute('role','alert');notice.setAttribute('aria-live','assertive');notice.style.cssText='position:fixed;left:1rem;right:1rem;bottom:1rem;z-index:2147483647;display:none;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;padding:1rem;border:2px solid #ffcc80;border-radius:.5rem;background:#241317;color:#fff;font:600 16px/1.4 sans-serif;box-shadow:0 4px 24px #0009';const message=document.createElement('span');message.textContent='WebGL graphics stopped. Reload this page, then use Load to restore the latest autosave. Unsaved orders may be lost.';message.style.cssText='flex:1 1 18rem;min-width:0';const reload=document.createElement('button');reload.type='button';reload.textContent='Reload page';reload.setAttribute('aria-label','Reload the game to recover from a graphics failure');reload.style.cssText='flex:none;min-height:48px;padding:.5rem 1rem;border:1px solid #fff;border-radius:.35rem;background:#fff;color:#171717;font:700 16px sans-serif';reload.addEventListener('click',()=>window.location.reload());notice.append(message,reload);document.body.appendChild(notice);canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();window.__m11WebGLContextLost=true;canvas.style.pointerEvents='none';canvas.inert=true;canvas.blur();notice.hidden=false;notice.style.display='flex';reload.focus();});};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',install,{once:true});}else{install();}})();</script>"
html/canvas_resize_policy=2
